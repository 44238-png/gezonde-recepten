/* =========================
   FILTERS
========================= */

let selectedCategory = "Alles";

function setCategory(category, button) {

    selectedCategory = category;

    document.querySelectorAll(".category").forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    renderRecipes();
}


/* =========================
   FAVORIETEN
========================= */

let favorites =
    JSON.parse(localStorage.getItem("fitfoodFavorites")) || [];

function toggleFavorite(id) {

    if (favorites.includes(id)) {

        favorites = favorites.filter(item => item !== id);

    } else {

        favorites.push(id);

    }

    localStorage.setItem(
        "fitfoodFavorites",
        JSON.stringify(favorites)
    );

    renderRecipes();
}


/* =========================
   RECEPTEN WEERGEVEN
========================= */

function renderRecipes() {

    const grid =
        document.getElementById("recipeGrid");

    const empty =
        document.getElementById("empty");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const chef =
        document.getElementById("chefFilter").value;

    const maxKcal =
        Number(document.getElementById("kcalFilter").value);


    const filtered = recipes.filter(recipe => {

        const matchesSearch =
            recipe.title.toLowerCase().includes(search) ||
            recipe.chef.toLowerCase().includes(search) ||
            recipe.category.toLowerCase().includes(search);

        const matchesCategory =
            selectedCategory === "Alles" ||
            recipe.category === selectedCategory;

        const matchesChef =
            chef === "Alles" ||
            recipe.chef === chef;

        /*
        Belangrijk:
        Een onbekende kcal-waarde wordt NIET
        automatisch verwijderd.
        */

        const matchesKcal =
            recipe.kcal === null ||
            recipe.kcal <= maxKcal;


        return (
            matchesSearch &&
            matchesCategory &&
            matchesChef &&
            matchesKcal
        );

    });


    grid.innerHTML = "";


    filtered.forEach(recipe => {

        const favorite =
            favorites.includes(recipe.id);

        const kcalText =
            recipe.kcal === null
            ? "kcal niet vermeld"
            : recipe.kcal + " kcal";


        grid.innerHTML += `

            <article class="card">

                <div class="card-top">
                    ${recipe.icon}
                </div>

                <div class="card-content">

                    <h2>${recipe.title}</h2>

                    <div class="meta">
                        👨‍🍳 ${recipe.chef}
                        <br>
                        ⏱️ ${recipe.time}
                    </div>

                    <div class="tags">

                        <span class="tag">
                            ${recipe.category}
                        </span>

                        <span class="tag">
                            ${kcalText}
                        </span>

                    </div>

                    <p>
                        ${recipe.description}
                    </p>

                    <div class="buttons">

                        <button
                            class="view-btn"
                            onclick="openRecipe(${recipe.id})">
                            Bekijk recept →
                        </button>

                        <button
                            class="favorite-btn"
                            onclick="toggleFavorite(${recipe.id})">
                            ${favorite ? "❤️" : "♡"}
                        </button>

                    </div>

                </div>

            </article>

        `;

    });


    empty.style.display =
        filtered.length === 0
        ? "block"
        : "none";
}


/* =========================
   RECEPT OPENEN
========================= */

function openRecipe(id) {

    const recipe =
        recipes.find(item => item.id === id);

    if (!recipe) return;


    const kcalText =
        recipe.kcal === null
        ? "Calorieën niet vermeld"
        : recipe.kcal + " kcal";


    const ingredients =
        recipe.ingredients
        .map(item => `<li>${item}</li>`)
        .join("");


    const steps =
        recipe.steps
        .map(item => `<li>${item}</li>`)
        .join("");


    document.getElementById("detailContent").innerHTML = `

        <div class="hero">

            <div class="hero-icon">
                ${recipe.icon}
            </div>

            <h1>${recipe.title}</h1>

            <div class="detail-meta">
                Recept van ${recipe.chef}
            </div>

            <div class="info-row">

                <div class="info">
                    ⏱️ ${recipe.time}
                </div>

                <div class="info">
                    🏷️ ${recipe.category}
                </div>

                <div class="info">
                    ${kcalText}
                </div>

            </div>

        </div>


        <div class="detail-section">

            <h2>📖 Over dit recept</h2>

            <p>
                ${recipe.description}
            </p>

            <p>
                Hieronder staat een korte samenvatting.
                Voor de volledige ingrediëntenlijst en
                bereidingswijze kun je de originele bron
                bekijken.
            </p>

        </div>


        <div class="detail-section">

            <h2>🛒 Ingrediënten — samenvatting</h2>

            <ul class="ingredients">
                ${ingredients}
            </ul>

        </div>


        <div class="detail-section">

            <h2>👨‍🍳 Bereiding — samenvatting</h2>

            <ol class="steps">
                ${steps}
            </ol>

        </div>


        <div class="detail-section">

            <h2>🌐 Originele receptpagina</h2>

            <p>
                Dit recept is gebaseerd op het recept van
                de genoemde chef. Bekijk de originele pagina
                voor de volledige ingrediënten en bereidingswijze.
            </p>

            <a
                class="source-btn"
                href="${recipe.source}"
                target="_blank"
                rel="noopener">
                Bekijk originele bron →
            </a>

        </div>

    `;


    document.getElementById("detailPage").style.display =
        "block";

    document.body.style.overflow =
        "hidden";
}


/* =========================
   RECEPT SLUITEN
========================= */

function closeRecipe() {

    document.getElementById("detailPage").style.display =
        "none";

    document.body.style.overflow =
        "auto";
}


/* =========================
   START
========================= */

renderRecipes();

</script>

</body>
